[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "faceforge-api"
version = "0.1.0"
description = "FaceForge API 网关:REST + WebSocket"
requires-python = ">=3.9"
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "pydantic>=2.5"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
ignore = ["FA100"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
